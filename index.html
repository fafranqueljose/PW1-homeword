<h2>Comentarios</h2>
<input id="coment" placeholder="Escribe un comentario" />
<button onclick="comentar()">Enviar</button>
<div id="lista"></div>

<script>
  function comentar() {
    const c = document.getElementById("coment");
    if (!c.value) return;
    const p = document.createElement("p");
    p.textContent = c.value;
    document.getElementById("lista").appendChild(p);
    c.value = "";
  }
</script>
